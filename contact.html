<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Contact Bike Info with questions or corrections." />
  <meta name="theme-color" content="#ffffff" />
  <title>Bike Info — Contact</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>

  <header class="site-header">
    <div class="container site-header__inner">
      <a class="brand" href="index.html">Bike Info</a>
      <nav class="site-nav" aria-label="Primary">
        <ul class="site-nav__list">
          <li><a href="index.html">Home</a></li>
          <li><a href="types.html">Types</a></li>
          <li><a href="safety.html">Safety</a></li>
          <li><a href="contact.html" aria-current="page">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main" class="site-main">
    <div class="container section">
      <h1>Contact</h1>
      <p class="lead">Static placeholder form. Wire to a backend or form service later.</p>
      <form action="#" method="get">
        <p>
          <label for="name">Name</label><br />
          <input id="name" name="name" type="text" autocomplete="name" required />
        </p>
        <p>
          <label for="email">Email</label><br />
          <input id="email" name="email" type="email" autocomplete="email" required />
        </p>
        <p>
          <label for="message">Message</label><br />
          <textarea id="message" name="message" rows="5" required></textarea>
        </p>
        <p><button class="button" type="submit">Send</button></p>
      </form>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p><small>© 2026 Bike Info. Boilerplate footer — replace as needed.</small></p>
    </div>
  </footer>
</body>
</html>
